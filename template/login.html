<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoShop - Login</title>

    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>

  <header class="header">
    <div class="header-inner">
      <div class="logo">GoShop</div>

      <input type="checkbox" id="menu-toggle" />
      <label for="menu-toggle" class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <nav class="nav">
        <a href="/">Home</a>
      </nav>
    </div>
  </header>

  <body>
    <div
      class="container"
      style="display: flex; justify-content: center; margin-top: 60px"
    >
      <div class="card" style="max-width: 380px; width: 100%">
        <div class="card-body">
          <div class="title" style="font-size: 20px; text-align: center">
            Login
          </div>

          <form
            method="POST"
            action="/login"
            style="display: flex; flex-direction: column; gap: 12px"
          >
            <div>
              <label class="category">Username</label>
              <input
                type="text"
                name="username"
                required
                style="
                  width: 90%;
                  padding: 10px 12px;
                  border-radius: 8px;
                  border: 1px solid #ddd;
                  font-size: 14px;
                "
              />
            </div>

            <div>
              <label class="category">Password</label>
              <input
                type="password"
                name="password"
                required
                style="
                  width: 90%;
                  padding: 10px 12px;
                  border-radius: 8px;
                  border: 1px solid #ddd;
                  font-size: 14px;
                "
              />
            </div>

            <button
              type="submit"
              style="
                margin-top: 8px;
                padding: 12px;
                border: none;
                border-radius: 10px;
                background: #cf7500;
                color: #fff;
                font-size: 15px;
                font-weight: 600;
                cursor: pointer;
              "
            >
              Login
            </button>
          </form>

          <div style="text-align: center; font-size: 14px; margin-top: 10px">
            Don’t have an account?
            <a
              href="/register"
              style="color: #cf7500; text-decoration: none; font-weight: 500"
            >
              Register
            </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
