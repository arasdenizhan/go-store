<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>500 - Internal Server Error | GoShop</title>

    <link rel="stylesheet" href="/static/css/404-styles.css" />
  </head>

  <body>
    <header class="header">
      <div class="header-inner">
        <div class="logo">GoShop</div>
      </div>
    </header>

    <main class="notfound">
      <div class="card">
        <div class="code">500</div>
        <div class="title">Internal Server Error</div>
        <div class="description">
          Something went wrong on our side. Please try again later or return to
          the homepage.
        </div>

        <div class="actions">
          <a href="/" class="btn btn-primary">Go to Homepage</a>
        </div>
      </div>
    </main>
  </body>
</html>
